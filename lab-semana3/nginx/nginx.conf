# =====================================================================
#  QuestCash — Semana 3
#  Nginx como balanceador de carga frente a 2 instancias idénticas de la API
# =====================================================================
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -----------------------------------------------------------------
    #  Formato de log ampliado: registra QUÉ instancia atendió cada
    #  peticion ($upstream_addr) y con qué codigo respondio
    #  ($upstream_status). Es la evidencia del reparto y del failover.
    # -----------------------------------------------------------------
    log_format lb '$remote_addr [$time_local] "$request" '
                  'status=$status upstream=$upstream_addr '
                  'upstream_status=$upstream_status '
                  'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log lb;
    error_log  /var/log/nginx/error.log warn;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;          # no revelar la version de Nginx

    # -----------------------------------------------------------------
    #  GRUPO DE SERVIDORES (upstream)
    #
    #  Las dos instancias son IDENTICAS: misma imagen, mismo codigo,
    #  misma base de datos. Por eso una puede sustituir a la otra.
    #
    #  Algoritmo: round-robin (el de por defecto). Nginx reparte las
    #  peticiones alternando entre los servidores de la lista.
    #
    #  Health check PASIVO: si una instancia falla `max_fails` veces,
    #  Nginx la marca como caida y deja de mandarle trafico durante
    #  `fail_timeout` segundos. Luego vuelve a probarla sola.
    # -----------------------------------------------------------------
    upstream questcash_api {
        server api1:5000 max_fails=1 fail_timeout=5s;
        server api2:5000 max_fails=1 fail_timeout=5s;

        keepalive 32;           # conexiones reutilizadas hacia el backend
    }

    server {
        listen 80;
        server_name _;

        # Cabecera de diagnostico: le dice al cliente que instancia respondio.
        # (En produccion se quita: da informacion de la topologia interna.)
        add_header X-Served-By $upstream_addr always;

        # -------------------------------------------------------------
        #  Salud del propio balanceador. Responde aunque las dos
        #  instancias esten caidas: distingue "se cayo Nginx" de
        #  "se cayeron los backends".
        # -------------------------------------------------------------
        location = /lb-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "balanceador vivo\n";
        }

        # -------------------------------------------------------------
        #  Metricas de Nginx para Netdata (conexiones activas, peticiones
        #  totales, etc.). Restringido a la red interna de Docker.
        # -------------------------------------------------------------
        location = /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;    # red por defecto de Docker
            allow 192.168.0.0/16;
            deny  all;
        }

        # -------------------------------------------------------------
        #  Todo lo demas se reparte entre las dos instancias.
        # -------------------------------------------------------------
        location / {
            proxy_pass http://questcash_api;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ---- Tolerancia a fallas -----------------------------------
            # Si la instancia elegida no responde, Nginx REINTENTA en la
            # otra dentro de la MISMA peticion. El cliente nunca ve el
            # error: por eso la prueba de failover da 0 respuestas fallidas.
            proxy_next_upstream       error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_connect_timeout 2s;
            proxy_send_timeout   10s;
            proxy_read_timeout   10s;
        }
    }
}

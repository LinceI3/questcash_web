# =====================================================================
#  QuestCash — entorno de DESARROLLO local.
#
#  Este archivo es para trabajar en la máquina, no para producción. La
#  definición parecida a producción vive en docker-compose.segmentado.yml
#  (gunicorn con varios workers, Postgres sin puertos publicados en una red
#  interna y un solo puerto de entrada por el gateway Nginx).
#
#  Diferencias deliberadas respecto a producción:
#    - el código se monta como volumen y gunicorn corre con --reload, así que
#      un cambio en un .py se aplica solo: no hay que reconstruir la imagen;
#    - un solo worker, que hace la recarga más rápida;
#    - el puerto de la aplicación se publica en 5001, que es el que la app
#      móvil ya busca (src/services/api.ts).
#
#  NINGÚN SECRETO ESTÁ ESCRITO AQUÍ. Todos vienen de .env, que no se versiona.
#  Si falta alguno, el arranque falla con un mensaje claro en vez de usar un
#  valor por omisión inseguro.
#
#  Uso:
#      docker compose up          # levanta y sigue los logs
#      docker compose up -d       # en segundo plano
#      docker compose down        # detiene (conserva los datos)
# =====================================================================
name: questcash

services:
  web:
    build: .
    container_name: questcash_web
    restart: unless-stopped
    environment:
      # --- Base de datos: se arma desde las piezas de .env ---------------
      DATABASE_URL: postgresql://${POSTGRES_USER:?define POSTGRES_USER en .env}:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:?define POSTGRES_DB en .env}
      DB_HOST: db

      # --- Secretos: obligatorios, sin valor por omisión -----------------
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY en .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?define JWT_SECRET_KEY en .env}
      DATA_ENC_KEY: ${DATA_ENC_KEY:?define DATA_ENC_KEY en .env — sin ella el cifrado se deriva de SECRET_KEY}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?define BLIND_INDEX_KEY en .env}

      # --- Ajustes propios de desarrollo ---------------------------------
      REDIS_URL: redis://cache:6379/0

      # --- Correo: en local va a Mailpit, que no reenvía nada a nadie ------
      MAIL_SMTP_HOST: correo
      MAIL_SMTP_PUERTO: 1025
      MAIL_SMTP_TLS: 0
      MAIL_REMITENTE: no-responder@questcash.local
      APP_URL: http://localhost:5001
      GUNICORN_WORKERS: 1
      GUNICORN_RELOAD: 1
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    ports:
      # 5001 en el anfitrión: es el puerto que espera la app móvil.
      - "5001:5000"
    volumes:
      # El código en vivo. Con --reload, editar un .py recarga el worker.
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      correo:
        condition: service_started

  db:
    image: postgres:15
    container_name: questcash_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB en .env}
    ports:
      # Publicado solo en el loopback: accesible con psql desde la Mac, no
      # desde la red local. En producción no se publica en absoluto.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servidor SMTP de mentira para desarrollo: recibe todo el correo que manda
  # la aplicación y NO lo reenvía a ninguna dirección real. La bandeja se ve en
  # http://localhost:8025 — permite revisar cómo le llega un correo al usuario
  # sin haber contratado ningún proveedor y sin arriesgarse a escribirle a
  # alguien de verdad desde una máquina de desarrollo.
  correo:
    image: axllent/mailpit:latest
    container_name: questcash_correo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # bandeja web
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Estado compartido entre procesos: control de intentos de inicio de sesión.
  # Sin esto, cada worker de gunicorn lleva su propia cuenta y un atacante
  # dispone de tantos intentos como workers haya.
  cache:
    image: redis:7-alpine
    container_name: questcash_cache
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

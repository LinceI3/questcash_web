# =====================================================================
#  QuestCash — Nginx del plano público (docker-compose.segmentado.yml)
#
#  Es la ÚNICA pieza alcanzable desde fuera. Habla con la aplicación por la
#  red `publica`; no tiene ruta hacia Postgres, que vive en una red interna.
#
#  No confundir con lab-semana3/nginx/nginx.conf: aquel es el balanceador de
#  dos instancias del laboratorio de la semana 3 y apunta a `api1`/`api2`,
#  servicios que no existen en esta topología. Montarlo aquí dejaba el gateway
#  en bucle de reinicio con "host not found in upstream api1:5000", así que la
#  pila tipo producción nunca llegó a servir tráfico por el gateway.
# =====================================================================
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format questcash '$remote_addr [$time_local] "$request" '
                         'status=$status rt=$request_time '
                         'urt=$upstream_response_time';

    access_log /var/log/nginx/access.log questcash;
    error_log  /var/log/nginx/error.log warn;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;          # no revelar la versión de Nginx

    # Tamaño máximo de subida: debe coincidir con MAX_CONTENT_LENGTH (2 MB).
    # Si Nginx lo deja pasar, Flask responde 413 igualmente, pero se ahorra
    # transferir el cuerpo entero para rechazarlo al final.
    client_max_body_size 2m;

    upstream questcash_app {
        server web:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Salud del propio gateway. Responde aunque la aplicación esté caída,
        # lo que distingue "se cayó Nginx" de "se cayó la aplicación".
        location = /gateway-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "gateway vivo\n";
        }

        location / {
            proxy_pass http://questcash_app;
            proxy_http_version 1.1;

            # Sin estas cabeceras la aplicación ve como IP de origen la del
            # contenedor de Nginx, no la del usuario: el control de intentos de
            # inicio de sesión agruparía a TODO el mundo bajo una sola clave.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # Los estáticos los sigue sirviendo Flask por ahora. Cuando las fotos
        # de perfil se muevan a almacenamiento de objetos (WEB-09), este bloque
        # es el sitio natural para cachearlos.
        location /static/ {
            proxy_pass http://questcash_app;
            proxy_set_header Host $host;
            expires 1h;
            add_header Cache-Control "public";
        }
    }
}
